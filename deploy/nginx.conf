# 境内单机托管的站点配置：静态 SPA + 同源 /api 代理到 Node 实时价服务。
# 缓存口径对齐 public/_headers（index.html no-cache、/assets 永久、/data 5 分钟）。
# Cloudflare 不压缩 text/csv，这里在 gzip_types 显式带上 text/csv，避免 3MB 级 index_bars 原样下发。

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/plain text/css text/csv application/json application/javascript application/wasm image/svg+xml;

    # 实时价：同源代理到本机 Node quote 服务（境内服务器直连东财/新浪/腾讯，快且可达）。
    location /api/ {
        proxy_pass http://quote:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 构建产物带内容哈希，可永久强缓存。
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 数据 CSV/JSON：短缓存 + 必须回源校验（每日仅同步数次）。
    location /data/ {
        add_header Cache-Control "public, max-age=300, must-revalidate";
        try_files $uri =404;
    }

    # 入口 HTML 不缓存，保证发版即时生效（SPA 回退到此文件时也命中本规则）。
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # SPA 路由回退：未命中静态文件的路径一律交给前端路由。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
