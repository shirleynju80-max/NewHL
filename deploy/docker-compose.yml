# 境内单机托管：Nginx 提供 dist 静态 + 同源代理 /api 到 Node 实时价服务。
# 本地验证：仓库根目录先 `npm run build` 生成 dist/，再 `docker compose -f deploy/docker-compose.yml up`。
# 默认对外 80 端口；本地若被占用可 `WEB_PORT=8080 docker compose ... up`，再访问 http://localhost:8080。
services:
  quote:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.quote
    environment:
      - PORT=8787
    expose:
      - "8787"
    restart: unless-stopped

  web:
    image: nginx:1.27-alpine
    depends_on:
      - quote
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
