# 境内单机托管部署：push main 构建 dist/（含 public/data/*），rsync 到境内服务器并重启容器。
# 与 cloudflare-pages-deploy.yml 并行（CF 保留为海外/备份），互不影响。
#
# 默认休眠：未配置仓库变量 DOMESTIC_DEPLOY_ENABLED=true 时整个 job 跳过，CI 不会因缺基础设施而变红。
# 备案 + 服务器就绪后：在 Settings → Secrets and variables → Actions 配置
#   变量(Variables): DOMESTIC_DEPLOY_ENABLED = true
#   机密(Secrets):   DOMESTIC_SSH_HOST / DOMESTIC_SSH_USER / DOMESTIC_SSH_KEY / DOMESTIC_DEPLOY_PATH
#
# 关键：构建不注入 VITE_DATA_API_BASE_URL —— 数据 CSV 与 /api/quote 全部走同源，彻底脱离 workers.dev。
name: Domestic deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ vars.DOMESTIC_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build (same-origin, no VITE_DATA_API_BASE_URL)
        run: |
          npm ci
          npm run build
          test -f dist/index.html
          test -f dist/data/index_bars.csv

      - name: Deploy over SSH
        env:
          SSH_KEY: ${{ secrets.DOMESTIC_SSH_KEY }}
          HOST: ${{ secrets.DOMESTIC_SSH_HOST }}
          SSH_USER: ${{ secrets.DOMESTIC_SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DOMESTIC_DEPLOY_PATH }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i ~/.ssh/id_deploy -o StrictHostKeyChecking=yes"
          $SSH "$SSH_USER@$HOST" "mkdir -p '$DEPLOY_PATH'"
          # dist 用 --delete 保持与构建产物一致；deploy/ 与 worker 源码用于服务器侧 compose 构建。
          rsync -az --delete -e "$SSH" dist/ "$SSH_USER@$HOST:$DEPLOY_PATH/dist/"
          rsync -az -e "$SSH" deploy/ "$SSH_USER@$HOST:$DEPLOY_PATH/deploy/"
          rsync -az -e "$SSH" workers/data-api/src/ "$SSH_USER@$HOST:$DEPLOY_PATH/workers/data-api/src/"
          $SSH "$SSH_USER@$HOST" "cd '$DEPLOY_PATH' && docker compose -f deploy/docker-compose.yml up -d --build"
