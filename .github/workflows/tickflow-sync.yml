# 工作日盘后拉 TickFlow 日 K，合并 public/data/bars.csv 并提交（需仓库 Secret：TICKFLOW_API_KEY）
name: TickFlow sync bars

on:
  workflow_dispatch:
  schedule:
    # 周一至周五 08:40 UTC ≈ 16:40 北京时间（A 股收盘后）
    - cron: "40 8 * * 1-5"

concurrency:
  group: tickflow-sync-bars
  cancel-in-progress: true

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: scripts/tickflow_sync/requirements.txt

      - name: Install deps
        run: pip install -r scripts/tickflow_sync/requirements.txt

      - name: Sync bars from TickFlow
        env:
          TICKFLOW_API_KEY: ${{ secrets.TICKFLOW_API_KEY }}
          TICKFLOW_ETFS_CSV: scripts/tickflow_sync/sync_etfs_full.csv
          # 增量模式只需最近若干根日 K
          TICKFLOW_KLINE_COUNT: "400"
          TICKFLOW_ADJUST: "forward"
        run: python scripts/tickflow_sync/sync_bars.py

      - name: Commit bars.csv if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/bars.csv
          if git diff --staged --quiet; then
            echo "No changes to bars.csv"
          else
            git commit -m "chore(data): sync bars from TickFlow"
            git push
          fi
