# 工作日盘后运行指数 T-1 爬虫，补齐 public/data/index_bars.csv 等指数数据
name: Index T-1 sync

on:
  workflow_dispatch:
  schedule:
    # 北京时间 18:30；等待中证/国证当日数据发布后再跑。
    - cron: "30 10 * * 1-5"
    # 备用窗口：北京时间 20:30；用于网络抖动或上游短时失败后的补跑。
    - cron: "30 12 * * 1-5"

concurrency:
  group: index-t1-sync
  cancel-in-progress: true

jobs:
  sync-index-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      HSI_STALE_DAYS: "3"
      HSI_SYNC_RETRIES: "3"
      HSI_LOGIN_USERNAME: ${{ secrets.HSI_LOGIN_USERNAME }}
      HSI_LOGIN_PASSWORD: ${{ secrets.HSI_LOGIN_PASSWORD }}
      HSI_ACCESS_TOKEN: ${{ secrets.HSI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0

      - name: Pull optional data artifacts from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_BIN: wrangler
        run: bash scripts/cloudflare/download_public_data_from_r2.sh

      - name: Install deps
        run: pip install requests akshare

      - name: Sync index price / total return series
        run: python scripts/index_data_sync/sync_a_share_dividend_indices.py

      - name: Sync Hang Seng index series (optional)
        id: sync_hsi
        if: ${{ env.HSI_LOGIN_USERNAME != '' || env.HSI_ACCESS_TOKEN != '' }}
        continue-on-error: true
        run: |
          set +e
          n="${HSI_SYNC_RETRIES:-3}"
          [ "$n" -ge 1 ] 2>/dev/null || n=3
          attempt=1
          ok=0
          while [ "$attempt" -le "$n" ]; do
            echo "HSI sync attempt ${attempt}/${n}"
            python scripts/index_data_sync/sync_hsi_indices.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              ok=1
              break
            fi
            # token 类失败大概率不可恢复，不再盲重试
            if [ "$rc" -ne 0 ] && [ "$attempt" -lt "$n" ]; then
              echo "HSI sync failed (rc=$rc), retrying in $((attempt * 20))s ..."
              sleep $((attempt * 20))
            fi
            attempt=$((attempt + 1))
          done
          if [ "$ok" -ne 1 ]; then
            echo "HSI sync failed after ${n} attempts."
            exit 1
          fi

      - name: Warn if HSI sync failed
        if: ${{ (env.HSI_LOGIN_USERNAME != '' || env.HSI_ACCESS_TOKEN != '') && steps.sync_hsi.outcome == 'failure' }}
        run: |
          echo "::warning::HSI sync failed; check HSI_LOGIN_USERNAME/HSI_LOGIN_PASSWORD (or legacy HSI_ACCESS_TOKEN) and IndexLab account status."

      - name: Warn if HSI credentials missing
        if: ${{ env.HSI_LOGIN_USERNAME == '' && env.HSI_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning::HSI credentials missing; set HSI_LOGIN_USERNAME + HSI_LOGIN_PASSWORD in repository secrets."

      - name: Sync H30269 RedRocket DID
        run: python scripts/index_data_sync/sync_h30269_dividend_yield_redrocket.py

      - name: Sync OTC fund NAV (fund_bars.csv)
        run: python scripts/index_data_sync/sync_otc_fund_bars_em.py

      - name: Verify index tracking / product mapping
        run: node scripts/verify_etf_products.mjs

      - name: Check HSI recency guardrail
        id: check_hsi_freshness
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          from pathlib import Path

          stale_days = int(os.environ.get("HSI_STALE_DAYS", "3"))
          targets = ["HSI114", "HSSCSOY.HI"]
          path = Path("public/data/index_bars.csv")
          latest = {k: "" for k in targets}
          with path.open(newline="", encoding="utf-8-sig") as f:
            for row in csv.DictReader(f):
              code = row.get("index_code", "")
              d = row.get("date", "")
              if code in latest and d > latest[code]:
                latest[code] = d

          today = dt.date.today()
          def business_days_between(start: dt.date, end: dt.date) -> int:
            if end <= start:
              return 0
            days = 0
            cur = start
            while cur < end:
              cur += dt.timedelta(days=1)
              if cur.weekday() < 5:
                days += 1
            return days

          stale = []
          for code, date_str in latest.items():
            if not date_str:
              stale.append((code, "missing"))
              continue
            d = dt.date.fromisoformat(date_str)
            lag = business_days_between(d, today)
            if lag > stale_days:
              stale.append((code, f"{date_str} lag={lag}bd"))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"hsi_latest={latest}\n")
            out.write(f"hsi_stale={'none' if not stale else stale}\n")

          if stale:
            # 不再 raise，避免 HSI 同步失败连带阻断当天 A 股/红色火箭数据提交。
            print(f"::error::HSI 数据已过期，请检查 HSI 登录凭据或同步脚本：{stale}")
          else:
            print("HSI freshness check passed:", latest)
          PY

      - name: Commit index data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/index_bars.csv public/data/indices.csv public/data/index_tracking_etfs.csv public/data/redrocket_div_yield_meta.json public/data/fund_bars.csv
          if git diff --staged --quiet; then
            echo "No changes to index data"
          else
            git commit -m "chore(data): sync index t-1 data"
            git push
          fi

      - name: Notify Feishu / WeCom webhook on warnings or failure
        if: ${{ always() }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          HSI_CREDENTIALS_PRESENT: ${{ env.HSI_LOGIN_USERNAME != '' || env.HSI_ACCESS_TOKEN != '' }}
          HSI_SYNC_OUTCOME: ${{ steps.sync_hsi.outcome }}
          HSI_STALE: ${{ steps.check_hsi_freshness.outputs.hsi_stale }}
          HSI_LATEST: ${{ steps.check_hsi_freshness.outputs.hsi_latest }}
          JOB_STATUS: ${{ job.status }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import os
          import time
          import requests

          status = os.getenv("JOB_STATUS", "")
          credentials_present = os.getenv("HSI_CREDENTIALS_PRESENT", "") == "true"
          hsi_outcome = os.getenv("HSI_SYNC_OUTCOME", "")
          hsi_stale = os.getenv("HSI_STALE", "")
          hsi_latest = os.getenv("HSI_LATEST", "")
          run_url = f"{os.getenv('SERVER_URL')}/{os.getenv('REPO')}/actions/runs/{os.getenv('RUN_ID')}"

          hsi_data_stale = bool(hsi_stale) and hsi_stale != "none"

          warnings = []
          if hsi_data_stale:
            if credentials_present:
              warnings.append(
                f"HSI 数据已过期，请检查 HSI_LOGIN_USERNAME/HSI_LOGIN_PASSWORD 或同步脚本：{hsi_stale}"
              )
            else:
              warnings.append(f"HSI 数据已过期且未配置 HSI 登录凭据：{hsi_stale}")
          elif credentials_present and hsi_outcome == "failure":
            print(
              "HSI 同步失败，但数据仍在容忍期内（未超过 HSI_STALE_DAYS），本次不发告警。"
            )
          elif not credentials_present:
            print("HSI 登录凭据未配置，但数据仍在容忍期内，本次不发告警。")

          should_notify = status != "success" or bool(warnings)
          if not should_notify:
            print("No warning/failure; skip webhook notification.")
            raise SystemExit(0)

          level = "WARN" if status == "success" else "ERROR"
          text = (
            f"[{level}] Index T-1 sync {status}\n"
            f"Repo: {os.getenv('REPO')}\n"
            f"HSI latest: {hsi_latest}\n"
            f"Warnings: {', '.join(warnings) if warnings else 'none'}\n"
            f"Run: {run_url}"
          )

          feishu = os.getenv("FEISHU_WEBHOOK_URL", "").strip()
          feishu_secret = os.getenv("FEISHU_BOT_SECRET", "").strip()
          if feishu:
            try:
              payload = {"msg_type": "text", "content": {"text": text}}
              # 飞书签名校验：timestamp + '\n' + secret 做 HMAC-SHA256，再 base64
              if feishu_secret:
                timestamp = str(int(time.time()))
                string_to_sign = f"{timestamp}\n{feishu_secret}".encode("utf-8")
                sign = base64.b64encode(
                  hmac.new(
                    string_to_sign,
                    digestmod=hashlib.sha256,
                  ).digest()
                ).decode("utf-8")
                payload["timestamp"] = timestamp
                payload["sign"] = sign
              requests.post(
                feishu,
                json=payload,
                timeout=15,
              ).raise_for_status()
              print("Feishu notification sent.")
            except Exception as e:
              print(f"Feishu notification failed: {e}")

          wecom = os.getenv("WECOM_WEBHOOK_URL", "").strip()
          if wecom:
            try:
              requests.post(
                wecom,
                json={"msgtype": "text", "text": {"content": text}},
                timeout=15,
              ).raise_for_status()
              print("WeCom notification sent.")
            except Exception as e:
              print(f"WeCom notification failed: {e}")
          PY
