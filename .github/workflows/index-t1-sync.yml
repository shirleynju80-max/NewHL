# 工作日盘后运行指数 T-1 爬虫，补齐 public/data/index_bars.csv 等指数数据
name: Index T-1 sync

on:
  workflow_dispatch:
  schedule:
    # 北京时间 18:35 / 20:35（UTC+8）；错开 realtime-crawler 18:30 的 push，减少并发冲突。
    - cron: "35 10 * * 1-5"
    # 备用窗口：北京时间 20:35。
    - cron: "35 12 * * 1-5"

concurrency:
  group: index-t1-sync
  cancel-in-progress: true

jobs:
  sync-index-data:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      HSI_STALE_DAYS: "3"
      HSI_SYNC_RETRIES: "3"
      HSI_LOGIN_USERNAME: ${{ secrets.HSI_LOGIN_USERNAME }}
      HSI_LOGIN_PASSWORD: ${{ secrets.HSI_LOGIN_PASSWORD }}
      HSI_ACCESS_TOKEN: ${{ secrets.HSI_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0

      - name: Pull optional data artifacts from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_BIN: wrangler
        run: bash scripts/cloudflare/download_public_data_from_r2.sh

      - name: Install deps
        run: pip install requests akshare

      - name: Sync index price / total return series
        run: python scripts/index_data_sync/sync_a_share_dividend_indices.py

      - name: Verify index bars consistency
        run: python scripts/index_data_sync/verify_index_bars.py

      - name: Sync Hang Seng index series (optional)
        id: sync_hsi
        if: ${{ env.HSI_LOGIN_USERNAME != '' || env.HSI_ACCESS_TOKEN != '' }}
        continue-on-error: true
        run: |
          set +e
          n="${HSI_SYNC_RETRIES:-3}"
          [ "$n" -ge 1 ] 2>/dev/null || n=3
          attempt=1
          ok=0
          while [ "$attempt" -le "$n" ]; do
            echo "HSI sync attempt ${attempt}/${n}"
            python scripts/index_data_sync/sync_hsi_indices.py
            rc=$?
            if [ "$rc" -eq 0 ]; then
              ok=1
              break
            fi
            # token 类失败大概率不可恢复，不再盲重试
            if [ "$rc" -ne 0 ] && [ "$attempt" -lt "$n" ]; then
              echo "HSI sync failed (rc=$rc), retrying in $((attempt * 20))s ..."
              sleep $((attempt * 20))
            fi
            attempt=$((attempt + 1))
          done
          if [ "$ok" -ne 1 ]; then
            echo "HSI sync failed after ${n} attempts."
            exit 1
          fi

      - name: Warn if HSI sync failed
        if: ${{ (env.HSI_LOGIN_USERNAME != '' || env.HSI_ACCESS_TOKEN != '') && steps.sync_hsi.outcome == 'failure' }}
        run: |
          echo "::warning::HSI sync failed; check HSI_LOGIN_USERNAME/HSI_LOGIN_PASSWORD (or legacy HSI_ACCESS_TOKEN) and IndexLab account status."

      - name: Warn if HSI credentials missing
        if: ${{ env.HSI_LOGIN_USERNAME == '' && env.HSI_ACCESS_TOKEN == '' }}
        run: |
          echo "::warning::HSI credentials missing; set HSI_LOGIN_USERNAME + HSI_LOGIN_PASSWORD in repository secrets."

      - name: Sync H30269 RedRocket DID
        run: python scripts/index_data_sync/sync_h30269_dividend_yield_redrocket.py

      - name: Sync OTC fund NAV (fund_bars.csv)
        run: python scripts/index_data_sync/sync_otc_fund_bars_em.py

      - name: Rebuild ETF product mapping snapshot for verification
        run: node scripts/generate_etf_products.mjs

      - name: Verify index tracking / product mapping
        run: node scripts/verify_etf_products.mjs

      - name: Check HSI recency guardrail
        id: check_hsi_freshness
        run: |
          python - <<'PY'
          import csv
          import datetime as dt
          import os
          from pathlib import Path

          stale_days = int(os.environ.get("HSI_STALE_DAYS", "3"))
          targets = ["HSI114", "HSSCSOY.HI"]
          path = Path("public/data/index_bars.csv")
          latest = {k: "" for k in targets}
          with path.open(newline="", encoding="utf-8-sig") as f:
            for row in csv.DictReader(f):
              code = row.get("index_code", "")
              d = row.get("date", "")
              if code in latest and d > latest[code]:
                latest[code] = d

          today = dt.date.today()
          def business_days_between(start: dt.date, end: dt.date) -> int:
            if end <= start:
              return 0
            days = 0
            cur = start
            while cur < end:
              cur += dt.timedelta(days=1)
              if cur.weekday() < 5:
                days += 1
            return days

          stale = []
          for code, date_str in latest.items():
            if not date_str:
              stale.append((code, "missing"))
              continue
            d = dt.date.fromisoformat(date_str)
            lag = business_days_between(d, today)
            if lag > stale_days:
              stale.append((code, f"{date_str} lag={lag}bd"))

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
            out.write(f"hsi_latest={latest}\n")
            out.write(f"hsi_stale={'none' if not stale else stale}\n")

          if stale:
            # 不再 raise，避免 HSI 同步失败连带阻断当天 A 股/红色火箭数据提交。
            print(f"::error::HSI 数据已过期，请检查 HSI 登录凭据或同步脚本：{stale}")
          else:
            print("HSI freshness check passed:", latest)
          PY

      - name: Commit index data if changed
        run: |
          bash scripts/github/commit_and_push_data.sh \
            "chore(data): sync index t-1 data" \
            public/data/index_bars.csv \
            public/data/indices.csv \
            public/data/index_tracking_etfs.csv \
            public/data/redrocket_div_yield_meta.json \
            public/data/fund_bars.csv

      - name: Notify Feishu / WeCom webhook on warnings or failure
        if: ${{ always() }}
        env:
          FEISHU_WEBHOOK_URL: ${{ secrets.FEISHU_WEBHOOK_URL }}
          FEISHU_BOT_SECRET: ${{ secrets.FEISHU_BOT_SECRET }}
          WECOM_WEBHOOK_URL: ${{ secrets.WECOM_WEBHOOK_URL }}
          HSI_CREDENTIALS_PRESENT: ${{ env.HSI_LOGIN_USERNAME != '' || env.HSI_ACCESS_TOKEN != '' }}
          HSI_SYNC_OUTCOME: ${{ steps.sync_hsi.outcome }}
          HSI_STALE: ${{ steps.check_hsi_freshness.outputs.hsi_stale }}
          HSI_LATEST: ${{ steps.check_hsi_freshness.outputs.hsi_latest }}
          JOB_STATUS: ${{ job.status }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          GITHUB_API_URL: ${{ github.api_url }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          WORKFLOW_FILE: index-t1-sync.yml
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          SERVER_URL: ${{ github.server_url }}
        run: python scripts/github/notify_index_t1_sync.py
