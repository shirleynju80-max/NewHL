name: ETF adjusted bars refresh

on:
  workflow_dispatch:
    inputs:
      codes:
        description: "Optional comma-separated ETF codes (retry subset)"
        required: false
        type: string
      sleep:
        description: "Seconds between ETFs"
        required: false
        default: "2"
      chunk_sleep:
        description: "Seconds between kline year chunks"
        required: false
        default: "1.2"
  schedule:
    # 每周日北京时间 20:30（UTC 12:30）跑一次分红事件检查 + 前复权全量刷新
    - cron: "30 12 * * 0"

concurrency:
  group: etf-adjusted-bars-refresh
  cancel-in-progress: true

jobs:
  refresh-adjusted-bars:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0

      - name: Pull optional data artifacts from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_BIN: wrangler
        run: bash scripts/cloudflare/download_public_data_from_r2.sh

      - name: Install deps
        run: pip install requests

      - name: Refresh ETF adjusted bars
        # 脚本内先抓 F10 分红、比对签名，再决定是否拉 K 线；无需单独前置任务。
        # 默认 20 只主跟踪（19 场内 + 007751 场外分红）；R2 已 bootstrap meta 避免冷启动误判。
        run: |
          ARGS=(--sleep "${{ github.event.inputs.sleep || '1.5' }}" --chunk-sleep "${{ github.event.inputs.chunk_sleep || '0.8' }}")
          if [ -n "${{ github.event.inputs.codes }}" ]; then
            ARGS+=(--codes "${{ github.event.inputs.codes }}")
          fi
          python scripts/realtime_crawler/sync_etf_adjusted_bars.py "${ARGS[@]}"

      - name: Commit adjusted data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/barsmore.csv public/data/etf_dividends.csv public/data/etf_adjusted_bars_meta.json
          if git diff --staged --quiet; then
            echo "No changes to adjusted ETF data"
          else
            git commit -m "chore(data): refresh ETF adjusted bars"
            git push
          fi
