# 每月更新 ETF 产品落地基础字段：规模、管理费、托管费、成立日期等
name: ETF products monthly sync

on:
  workflow_dispatch:
  schedule:
    # 每月 5 日北京时间 09:20；GitHub Actions 使用 UTC。
    - cron: "20 1 5 * *"

concurrency:
  group: etf-products-monthly
  cancel-in-progress: true

jobs:
  sync-etf-products:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0

      - name: Pull optional data artifacts from R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_BIN: wrangler
        run: bash scripts/cloudflare/download_public_data_from_r2.sh

      - name: Select index tracking ETF candidates
        run: node scripts/select_index_tracking_etfs.mjs

      - name: Sync ETF product fields
        run: node scripts/sync_etf_products_monthly.mjs

      - name: Verify ETF product table
        run: node scripts/verify_etf_products.mjs

      - name: Commit ETF product data if changed
        run: |
          bash scripts/github/commit_and_push_data.sh \
            "chore(data): sync ETF product metadata" \
            public/data/index_tracking_etfs.csv \
            public/data/etf_products.csv
