# 工作日定点运行 ETF 实时爬虫，补齐 public/data/barsmore.csv 并提交
name: Realtime crawler

on:
  workflow_dispatch:
  schedule:
    # 北京时间 11:00、14:00；GitHub Actions 使用 UTC。
    - cron: "0 3 * * 1-5"
    - cron: "0 6 * * 1-5"

concurrency:
  group: realtime-crawler
  cancel-in-progress: true

jobs:
  sync-etf-realtime:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests

      - name: Run ETF realtime crawler
        run: python scripts/realtime_crawler/sync_etf_realtime.py --skip-history

      - name: Check ETF dividends and refresh adjusted bars if needed
        run: python scripts/realtime_crawler/sync_etf_adjusted_bars.py

      - name: Commit realtime data if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f public/data/barsmore.csv public/data/etf_dividends.csv public/data/etf_adjusted_bars_meta.json
          if git diff --staged --quiet; then
            echo "No changes to ETF realtime / dividend data"
          else
            git commit -m "chore(data): run realtime crawler and dividend check"
            git push
          fi
