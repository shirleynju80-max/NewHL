# 将 public/data/*.csv 上传到 Cloudflare R2（供 Worker /api/bundle 读取）。
# 需在仓库 Secrets 配置 CLOUDFLARE_API_TOKEN（R2 Object Write + 可选 Account Read）。
name: Cloudflare R2 upload

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Realtime crawler", "Index T-1 sync"]
    types: [completed]

jobs:
  upload:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install wrangler
        run: npm install -g wrangler@4

      - name: Upload CSV to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "CLOUDFLARE_API_TOKEN not set; skip R2 upload."
            exit 0
          fi
          bash scripts/cloudflare/upload_public_data_to_r2.sh
