# 可选：用 Cloudflare Pages 直连 Git 构建时，本 workflow 仅作手动触发备份。
# 推荐在 Cloudflare Dashboard 连接 GitHub 并配置 VITE_DATA_API_BASE_URL。
name: Cloudflare Pages deploy (manual)

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "Configure secrets under Settings → Secrets and variables → Actions."
            echo "Token needs: Account / Cloudflare Pages → Edit, Account → Read."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        env:
          VITE_DATA_API_BASE_URL: ${{ secrets.VITE_DATA_API_BASE_URL }}
        run: |
          npm ci
          npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # --branch 须与 Pages 项目 Settings → Production branch 一致（通常 main），否则只进 Preview
          command: pages deploy dist --project-name=newhl-dashboard --branch=main --commit-dirty=true
