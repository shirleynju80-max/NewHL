# newhl-dashboard 为 Direct Upload 项目（Settings 无 Builds / Connect to Git）时，
# push main 由本 workflow 构建并 wrangler pages deploy 到 Production。
#
# 数据 sync workflow 用 GITHUB_TOKEN git push，不会触发 on:push（GitHub 防循环机制）。
# 故与 cloudflare-r2-upload.yml 一样，在 sync 完成后用 workflow_run 补触发，刷新 dist/data/。
name: Cloudflare Pages deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows:
      - "Realtime crawler"
      - "Index T-1 sync"
      - "ETF adjusted bars refresh"
      - "ETF products monthly sync"
      - "Bonds monthly sync"
    types: [completed]

concurrency:
  group: cloudflare-pages-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Pull latest main (after data sync push)
        if: github.event_name == 'workflow_run'
        run: git pull --ff-only origin main

      - name: Verify Cloudflare secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VITE_DATA_API_BASE_URL: ${{ secrets.VITE_DATA_API_BASE_URL }}
        run: |
          missing=0
          if [[ -z "${CLOUDFLARE_API_TOKEN}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_API_TOKEN"
            missing=1
          fi
          if [[ -z "${CLOUDFLARE_ACCOUNT_ID}" ]]; then
            echo "::error::Missing repository secret CLOUDFLARE_ACCOUNT_ID"
            missing=1
          fi
          if [[ -z "${VITE_DATA_API_BASE_URL}" ]]; then
            echo "::warning::VITE_DATA_API_BASE_URL not set; using default Worker URL for build."
          fi
          if [[ "${missing}" -ne 0 ]]; then
            echo "Configure secrets under Settings → Secrets and variables → Actions."
            echo "Token needs: Account / Cloudflare Pages → Edit, Account → Read."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and build
        env:
          VITE_DATA_API_BASE_URL: ${{ secrets.VITE_DATA_API_BASE_URL != '' && secrets.VITE_DATA_API_BASE_URL || 'https://newhl-data-api.shirleynju80.workers.dev' }}
        run: |
          echo "VITE_DATA_API_BASE_URL is set for build (${#VITE_DATA_API_BASE_URL} chars)"
          npm ci
          npm run build

      - name: Resolve deploy SHA
        id: sha
        run: echo "value=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify build artifacts
        run: |
          set -euo pipefail
          echo "Git SHA: ${{ steps.sha.outputs.value }}"
          test -f dist/index.html
          echo "=== index.html script tags ==="
          grep -oE 'src="/assets/[^"]+"' dist/index.html || true
          echo "=== main + home chunks ==="
          ls dist/assets/index-*.js dist/assets/Home-*.js
          echo "=== cache headers (_headers) ==="
          test -f dist/_headers
          head -6 dist/_headers

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.95.0"
          # --branch 须与 Pages 项目 Settings → Production branch 一致（通常 main），否则只进 Preview
          command: pages deploy dist --project-name=newhl-dashboard --branch=main --commit-hash=${{ steps.sha.outputs.value }} --commit-message=Deploy-${{ steps.sha.outputs.value }}

      - name: Verify production site
        run: |
          set -euo pipefail
          SITE="https://newhl-dashboard.pages.dev"
          HOME_FILE="$(basename dist/assets/Home-*.js)"
          echo "Expect Home chunk on CDN: ${HOME_FILE}"
          sleep 20
          for i in 1 2 3 4 5; do
            BODY="$(curl -fsSL "${SITE}/assets/${HOME_FILE}")"
            BYTES="$(printf '%s' "$BODY" | wc -c | tr -d ' ')"
            if [[ "$BYTES" -gt 10000 ]] && printf '%s' "$BODY" | grep -q '不构成投资建议'; then
              echo "Production OK: ${SITE}/assets/${HOME_FILE} (${BYTES} bytes)"
              exit 0
            fi
            echo "Attempt ${i}/5: not ready yet (${BYTES} bytes), retry in 15s…"
            sleep 15
          done
          echo "::error::Production did not serve the new Home chunk within timeout."
          exit 1

      - name: Verify production quote API
        run: |
          set -euo pipefail
          SITE="https://newhl-dashboard.pages.dev"
          BODY="$(curl -fsSL "${SITE}/api/quote?code=513920")"
          echo "${BODY}" | python3 -c "import json,sys; d=json.load(sys.stdin); assert d.get('ok') and d.get('price',0)>0, d"
          echo "Production quote API OK (same-origin JSON, not SPA HTML)"

      - name: Verify production ETF bars match repo
        run: |
          set -euo pipefail
          SITE="https://newhl-dashboard.pages.dev"
          for code in 515450 512890; do
            LOCAL="$(grep -c "^${code}," public/data/barsmore.csv || true)"
            REMOTE="$(curl -fsSL "${SITE}/data/barsmore.csv" | grep -c "^${code}," || true)"
            echo "${code}: local barsmore=${LOCAL} production=${REMOTE}"
            if [ "${REMOTE}" -lt $((LOCAL * 95 / 100)) ]; then
              echo "::error::Production barsmore for ${code} stale (${REMOTE} < ${LOCAL})"
              exit 1
            fi
          done
          echo "Production barsmore row counts OK vs repo"
